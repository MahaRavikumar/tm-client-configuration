<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" font-family="Arial, Helvetica, sans-serif">
  <style>
    :root { color-scheme: light; }
    .screen { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
    .title { fill:#0f172a; font-weight:bold; }
    .row { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.3; }
    .label { fill:#1e293b; }
    .sublabel { fill:#94a3b8; }
    .chev { fill:#94a3b8; }
    .back { fill:#475569; }
    .frameid { fill:#cbd5e1; font-style:italic; }
    .cta { fill:#334155; }
    .ctatext { fill:#ffffff; font-weight:bold; }
    .crumb { fill:#94a3b8; }
    .note { fill:#8a94a1; font-style:italic; }
    .sect { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.3; }
    .secthdr { fill:#64748b; font-weight:bold; letter-spacing:0.5px; }
    .sectcap { fill:#94a3b8; font-style:italic; }
    .cl { fill:#1e293b; font-weight:bold; }
    .pillsel { fill:#4338ca; }
    .pillseltext { fill:#ffffff; font-weight:bold; }
    .pillmuted { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1; }
    .pillmutedtext { fill:#b6c0cc; }
  </style>

  <rect x="20" y="20" width="440" height="500" rx="14" class="screen"/>
  <text x="436" y="40" text-anchor="end" font-size="10" class="frameid">F1.D · Default rule</text>
  <text x="44" y="54" font-size="13" class="back">&#8249; Back</text>
  <text x="44" y="80" font-size="11.5" class="crumb">Capture Rules ›</text>
  <text x="44" y="104" font-size="22" class="title">Default rule</text>
  <line x1="44" y1="120" x2="436" y2="120" stroke="#eef2f6" stroke-width="1.5"/>
  <text x="44" y="144" font-size="11.5" class="note">Applies to everything not covered by a specific rule.</text>
  <text x="44" y="162" font-size="11.5" class="note">It has no scope — it's the catch-all.</text>

  <!-- Capture section -->
  <rect x="40" y="178" width="400" height="228" rx="10" class="sect"/>
  <text x="56" y="200" font-size="11" class="secthdr">CAPTURE</text>
  <text x="56" y="216" font-size="10.5" class="sectcap">Capture level sets what's captured below</text>
  <text x="56" y="242" font-size="13" class="cl">Capture level</text>

  <!-- pills: Full selected, others muted -->
  <rect x="56" y="247" width="52" height="28" rx="14" class="pillsel"/>
  <text x="82" y="266" text-anchor="middle" font-size="11.5" class="pillseltext">Full</text>
  <rect x="118" y="247" width="94" height="28" rx="14" class="pillmuted"/>
  <text x="165" y="266" text-anchor="middle" font-size="11.5" class="pillmutedtext">Usage-only</text>
  <rect x="222" y="247" width="52" height="28" rx="14" class="pillmuted"/>
  <text x="248" y="266" text-anchor="middle" font-size="11.5" class="pillmutedtext">Deny</text>

  <!-- Attributes to capture -->
  <rect x="52" y="282" width="376" height="52" rx="8" class="row"/>
  <text x="70" y="304" font-size="14" class="label">Attributes to capture</text>
  <text x="70" y="322" font-size="11" fill="#15803d" font-weight="bold">Enabled</text>
  <text x="126" y="322" font-size="11" class="sublabel">· all events &amp; logs captured</text>
  <text x="410" y="308" font-size="20" class="chev">&#8250;</text>

  <!-- Screenshots -->
  <rect x="52" y="342" width="376" height="52" rx="8" class="row"/>
  <text x="70" y="364" font-size="14" class="label">Screenshots</text>
  <text x="70" y="382" font-size="11" fill="#15803d" font-weight="bold">Enabled</text>
  <text x="126" y="382" font-size="11" class="sublabel">· captured on click / scroll</text>
  <text x="410" y="368" font-size="20" class="chev">&#8250;</text>

  <!-- commit -->
  <rect x="44" y="446" width="392" height="46" rx="8" class="cta"/>
  <text x="240" y="475" text-anchor="middle" font-size="14" class="ctatext">&#10003;  This is where I'd do it</text>
</svg>
