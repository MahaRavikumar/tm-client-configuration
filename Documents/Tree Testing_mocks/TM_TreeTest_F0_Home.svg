<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" font-family="Arial, Helvetica, sans-serif">
  <style>
    :root { color-scheme: light; }
    .screen { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
    .title { fill:#0f172a; font-weight:bold; }
    .row { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.3; }
    .label { fill:#1e293b; }
    .chev { fill:#94a3b8; }
    .frameid { fill:#cbd5e1; font-style:italic; }
  </style>

  <!-- screen -->
  <rect x="20" y="20" width="440" height="500" rx="14" class="screen"/>
  <text x="44" y="62" font-size="22" class="title">Configuration</text>
  <line x1="44" y1="80" x2="436" y2="80" stroke="#eef2f6" stroke-width="1.5"/>
  <text x="436" y="40" text-anchor="end" font-size="10" class="frameid">F0 · Home</text>

  <!-- Capture Rules -->
  <rect x="44" y="104" width="392" height="54" rx="8" class="row"/>
  <text x="66" y="137" font-size="15" class="label">Capture Rules</text>
  <text x="414" y="138" font-size="20" class="chev">&#8250;</text>

  <!-- Privacy & Consent -->
  <rect x="44" y="168" width="392" height="54" rx="8" class="row"/>
  <text x="66" y="201" font-size="15" class="label">Privacy &amp; Consent</text>
  <text x="414" y="202" font-size="20" class="chev">&#8250;</text>

  <!-- Client Behaviour -->
  <rect x="44" y="232" width="392" height="54" rx="8" class="row"/>
  <text x="66" y="265" font-size="15" class="label">Client Behaviour</text>
  <text x="414" y="266" font-size="20" class="chev">&#8250;</text>

  <!-- Data Connection -->
  <rect x="44" y="296" width="392" height="54" rx="8" class="row"/>
  <text x="66" y="329" font-size="15" class="label">Data Connection</text>
  <text x="414" y="330" font-size="20" class="chev">&#8250;</text>

  <!-- User Attributes -->
  <rect x="44" y="360" width="392" height="54" rx="8" class="row"/>
  <text x="66" y="393" font-size="15" class="label">User Attributes</text>
  <text x="414" y="394" font-size="20" class="chev">&#8250;</text>

  <!-- Integrations & Extensions -->
  <rect x="44" y="424" width="392" height="54" rx="8" class="row"/>
  <text x="66" y="457" font-size="15" class="label">Integrations &amp; Extensions</text>
  <text x="414" y="458" font-size="20" class="chev">&#8250;</text>
</svg>
