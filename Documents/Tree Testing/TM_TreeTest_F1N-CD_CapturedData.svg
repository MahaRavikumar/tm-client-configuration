<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" font-family="Arial, Helvetica, sans-serif">
  <style>
    :root { color-scheme: light; }
    .screen { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
    .title { fill:#0f172a; font-weight:bold; }
    .back { fill:#475569; }
    .crumb { fill:#94a3b8; }
    .frameid { fill:#cbd5e1; font-style:italic; }
    .secthdr { fill:#64748b; font-weight:bold; letter-spacing:0.5px; }
    .label { fill:#1e293b; }
    .off { fill:#94a3b8; }
    .note { fill:#94a3b8; font-style:italic; }
    .cbon { fill:#4338ca; }
    .cboff { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.3; }
    .chk { fill:#ffffff; font-weight:bold; }
    .banner { fill:#eef2ff; stroke:#a5b4fc; stroke-width:1.2; }
    .bantext { fill:#3730a3; font-weight:bold; }
    .amber { fill:#b45309; font-weight:bold; }
    .cta { fill:#334155; }
    .ctatext { fill:#ffffff; font-weight:bold; }
    .more { fill:#94a3b8; }
  </style>

  <rect x="20" y="20" width="440" height="720" rx="14" class="screen"/>
  <text x="436" y="40" text-anchor="end" font-size="10" class="frameid">F1.N.CD · Captured data</text>
  <text x="44" y="54" font-size="13" class="back">&#8249; Back</text>
  <text x="44" y="80" font-size="11.5" class="crumb">Capture Rules › New rule ›</text>
  <text x="44" y="104" font-size="22" class="title">Captured data</text>
  <line x1="44" y1="120" x2="436" y2="120" stroke="#eef2f6" stroke-width="1.5"/>

  <rect x="44" y="132" width="392" height="32" rx="8" class="banner"/>
  <text x="56" y="152" font-size="11.5" class="bantext">Capture level: Usage-only</text>
  <text x="428" y="152" text-anchor="end" font-size="10.5" class="off">preset below · edits → Custom</text>

  <!-- SECTION 1: EVENTS -->
  <text x="44" y="196" font-size="11" class="secthdr">EVENTS · WHICH INTERACTIONS TO RECORD</text>

  <rect x="56" y="208" width="16" height="16" rx="4" class="cbon"/><text x="64" y="221" text-anchor="middle" font-size="12" class="chk">&#10003;</text>
  <text x="84" y="221" font-size="13" class="label">Active window changed</text>

  <rect x="56" y="238" width="16" height="16" rx="4" class="cbon"/><text x="64" y="251" text-anchor="middle" font-size="12" class="chk">&#10003;</text>
  <text x="84" y="251" font-size="13" class="label">Left click</text>

  <rect x="56" y="268" width="16" height="16" rx="4" class="cbon"/><text x="64" y="281" text-anchor="middle" font-size="12" class="chk">&#10003;</text>
  <text x="84" y="281" font-size="13" class="label">Entered text</text>
  <text x="210" y="281" font-size="11" class="note">— interaction kept</text>

  <rect x="56" y="298" width="16" height="16" rx="4" class="cbon"/><text x="64" y="311" text-anchor="middle" font-size="12" class="chk">&#10003;</text>
  <text x="84" y="311" font-size="13" class="label">Copy to clipboard</text>
  <text x="210" y="311" font-size="11" class="note">— interaction kept</text>

  <rect x="56" y="328" width="16" height="16" rx="4" class="cboff"/>
  <text x="84" y="341" font-size="13" class="off">Mouse wheel (scroll)</text>
  <text x="210" y="341" font-size="11" class="note">— noise, off</text>

  <text x="84" y="368" font-size="11" class="more">+ 26 more events…</text>

  <!-- SECTION 2: DATA FIELDS -->
  <line x1="44" y1="388" x2="436" y2="388" stroke="#eef2f6" stroke-width="1.5"/>
  <text x="44" y="414" font-size="11" class="secthdr">DATA FIELDS · LOGGED FOR EACH EVENT</text>

  <rect x="56" y="426" width="16" height="16" rx="4" class="cbon"/><text x="64" y="439" text-anchor="middle" font-size="12" class="chk">&#10003;</text>
  <text x="84" y="439" font-size="13" class="label">Timestamp (local)</text>

  <rect x="56" y="456" width="16" height="16" rx="4" class="cbon"/><text x="64" y="469" text-anchor="middle" font-size="12" class="chk">&#10003;</text>
  <text x="84" y="469" font-size="13" class="label">Application / window title</text>

  <rect x="56" y="486" width="16" height="16" rx="4" class="cbon"/><text x="64" y="499" text-anchor="middle" font-size="12" class="chk">&#10003;</text>
  <text x="84" y="499" font-size="13" class="label">Element name</text>

  <rect x="56" y="516" width="16" height="16" rx="4" class="cboff"/>
  <text x="84" y="529" font-size="13" class="off">Entered text (content)</text>
  <text x="238" y="529" font-size="10.5" class="amber">off</text>
  <text x="256" y="529" font-size="10.5" class="note">· Usage-only</text>

  <rect x="56" y="546" width="16" height="16" rx="4" class="cboff"/>
  <text x="84" y="559" font-size="13" class="off">Clipboard text (content)</text>
  <text x="246" y="559" font-size="10.5" class="amber">off</text>
  <text x="264" y="559" font-size="10.5" class="note">· Usage-only</text>

  <rect x="56" y="576" width="16" height="16" rx="4" class="cboff"/>
  <text x="84" y="589" font-size="13" class="off">Selected text (content)</text>
  <text x="238" y="589" font-size="10.5" class="amber">off</text>
  <text x="256" y="589" font-size="10.5" class="note">· Usage-only</text>

  <text x="84" y="616" font-size="11" class="more">+ 80 more fields…</text>

  <!-- helper -->
  <text x="44" y="648" font-size="10.5" class="note">Usage-only keeps the interaction events but leaves out the content fields</text>
  <text x="44" y="663" font-size="10.5" class="note">(what was typed or copied).</text>

  <!-- commit -->
  <rect x="44" y="682" width="392" height="44" rx="8" class="cta"/>
  <text x="240" y="710" text-anchor="middle" font-size="14" class="ctatext">&#10003;  This is where I'd do it</text>
</svg>
