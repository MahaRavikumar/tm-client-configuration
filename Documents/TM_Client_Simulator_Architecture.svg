<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="540" viewBox="0 0 1020 540" font-family="Arial, Helvetica, sans-serif">
  <style>
    :root { color-scheme: light; }
    .t { fill:#0f172a; font-weight:bold; }
    .muted { fill:#94a3b8; }
    .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
    .engine { fill:#f8fafc; stroke:#6366f1; stroke-width:1.6; }
    .step { fill:#ffffff; stroke:#c7d2fe; stroke-width:1.2; }
    .verdict { fill:#ecfdf5; stroke:#34d399; stroke-width:1.5; }
    .hd { fill:#1e293b; font-weight:bold; }
    .sub { fill:#64748b; }
    .lab { fill:#475569; font-style:italic; }
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  <marker id="d" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>

  <text x="34" y="34" font-size="18" class="t">Rule Capture Simulator — how it works</text>
  <text x="34" y="55" font-size="12" class="muted">Runs offline inside the config editor. No live capture, no real user data.</text>

  <!-- Rule config -->
  <rect x="30" y="96" width="230" height="86" rx="9" class="box"/>
  <text x="46" y="120" font-size="13" class="hd">Rule configuration</text>
  <text x="46" y="142" font-size="11" class="sub">Capture level · events / fields</text>
  <text x="46" y="160" font-size="11" class="sub">Redaction patterns · Hashing</text>

  <!-- Mock data -->
  <rect x="30" y="228" width="230" height="118" rx="9" class="box"/>
  <text x="46" y="252" font-size="13" class="hd">Mock data library</text>
  <text x="46" y="274" font-size="11" class="sub">Labelled sample records:</text>
  <text x="46" y="292" font-size="11" class="sub">PII types · app / URL / SAP · events</text>
  <text x="46" y="316" font-size="10.5" class="lab">sensitive values are tagged</text>
  <text x="46" y="332" font-size="10.5" class="lab">(the “answer key”)</text>

  <!-- Engine -->
  <rect x="300" y="104" width="352" height="250" rx="10" class="engine"/>
  <text x="318" y="130" font-size="14" class="hd">Simulation engine</text>
  <text x="318" y="149" font-size="10.5" class="lab">same logic as the live client — run offline</text>
  <rect x="316" y="162" width="320" height="38" rx="6" class="step"/>
  <text x="330" y="185" font-size="11.5" class="sub">1 · Scope match — does the sample’s app/URL fit?</text>
  <rect x="316" y="208" width="320" height="38" rx="6" class="step"/>
  <text x="330" y="231" font-size="11.5" class="sub">2 · Capture-level filter — drop excluded events/fields</text>
  <rect x="316" y="254" width="320" height="38" rx="6" class="step"/>
  <text x="330" y="277" font-size="11.5" class="sub">3 · Redaction — run regex over captured text</text>
  <rect x="316" y="300" width="320" height="38" rx="6" class="step"/>
  <text x="330" y="323" font-size="11.5" class="sub">4 · Hashing — hash flagged identifiers</text>

  <!-- Result -->
  <rect x="690" y="120" width="150" height="86" rx="9" class="box"/>
  <text x="706" y="150" font-size="12.5" class="hd">Result rows</text>
  <text x="706" y="171" font-size="10.5" class="sub">what would be</text>
  <text x="706" y="186" font-size="10.5" class="sub">stored</text>

  <!-- Preview -->
  <rect x="872" y="120" width="126" height="86" rx="9" class="box"/>
  <text x="888" y="150" font-size="12.5" class="hd">Preview UI</text>
  <text x="888" y="171" font-size="10.5" class="sub">input · output</text>
  <text x="888" y="186" font-size="10.5" class="sub">· verdict</text>

  <!-- Verdict -->
  <rect x="690" y="300" width="308" height="92" rx="10" class="verdict"/>
  <text x="706" y="326" font-size="13" class="hd">Verdict</text>
  <text x="706" y="347" font-size="10.8" class="sub">Did any tagged-sensitive value survive?  Pass / Fail</text>
  <text x="706" y="363" font-size="10.8" class="sub">+ summary; also confirms level &amp; hashing applied.</text>
  <text x="706" y="381" font-size="10.5" class="lab">rule-based check — not AI</text>

  <!-- arrows -->
  <line x1="260" y1="139" x2="298" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="260" y1="287" x2="298" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="652" y1="200" x2="688" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="840" y1="163" x2="870" y2="163" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="765" y1="206" x2="765" y2="298" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="935" y1="300" x2="935" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- dotted answer-key -->
  <path d="M150 346 L150 420 L690 420 L690 372" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#d)"/>
  <text x="360" y="414" font-size="10.5" class="lab">answer key (labels) →</text>
</svg>
