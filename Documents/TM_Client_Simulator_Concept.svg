<svg xmlns="http://www.w3.org/2000/svg" width="990" height="600" viewBox="0 0 990 600" font-family="Arial, Helvetica, sans-serif">
  <style>
    :root { color-scheme: light; }
    .t { fill:#0f172a; font-weight:bold; }
    .muted { fill:#94a3b8; }
    .strip { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.2; }
    .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.4; }
    .hdr { fill:#64748b; font-weight:bold; letter-spacing:0.5px; }
    .row { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.1; }
    .lab { fill:#64748b; }
    .val { fill:#1e293b; }
    .sensitive { fill:#b91c1c; font-weight:bold; }
    .pill { fill:#eef2ff; stroke:#a5b4fc; stroke-width:1; }
    .pilltext { fill:#3730a3; }
    .tagRed { fill:#b45309; font-weight:bold; }
    .tagGrn { fill:#15803d; font-weight:bold; }
    .tagBlu { fill:#3730a3; font-weight:bold; }
    .verdict { fill:#ecfdf5; stroke:#34d399; stroke-width:1.5; }
    .vtext { fill:#166534; }
    .btnO { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.3; }
    .btnF { fill:#334155; }
    .btnFT { fill:#ffffff; font-weight:bold; }
    .btnOT { fill:#334155; }
  </style>

  <text x="34" y="36" font-size="19" class="t">Rule Capture Simulator</text>
  <text x="250" y="36" font-size="12" class="muted">· future phase</text>
  <text x="34" y="58" font-size="12" class="muted">1  Configure the rule    →    2  Run it on sample data    →    3  See exactly what would be stored — before going live.</text>

  <!-- config strip -->
  <rect x="34" y="74" width="922" height="40" rx="8" class="strip"/>
  <text x="50" y="99" font-size="12" class="val">Simulating:   Capture level = Custom    ·    Redaction = SSN, Credit-card    ·    Hashing = username</text>
  <rect x="770" y="83" width="170" height="22" rx="11" class="pill"/>
  <text x="784" y="99" font-size="11" class="pilltext">Data source:  Sample data  ▾</text>

  <!-- LEFT panel: sample input -->
  <rect x="34" y="132" width="410" height="336" rx="10" class="panel"/>
  <text x="52" y="158" font-size="11" class="hdr">SAMPLE INPUT — MOCK ACTIVITY</text>

  <rect x="50" y="172" width="378" height="52" rx="7" class="row"/>
  <text x="64" y="194" font-size="12" class="lab">Typed in “SSN” field</text>
  <text x="64" y="212" font-size="12" class="sensitive">123-45-6789</text>

  <rect x="50" y="232" width="378" height="52" rx="7" class="row"/>
  <text x="64" y="254" font-size="12" class="lab">Typed in “Card” field</text>
  <text x="64" y="272" font-size="12" class="sensitive">4111 1111 1111 1111</text>

  <rect x="50" y="292" width="378" height="52" rx="7" class="row"/>
  <text x="64" y="314" font-size="12" class="lab">Clicked button</text>
  <text x="64" y="332" font-size="12" class="val">“Submit”</text>

  <rect x="50" y="352" width="378" height="52" rx="7" class="row"/>
  <text x="64" y="374" font-size="12" class="lab">Active app / page / user</text>
  <text x="64" y="392" font-size="12" class="val">Workday · workday.com/pay · jdoe</text>

  <!-- center: run -->
  <text x="495" y="296" text-anchor="middle" font-size="12" class="t">Simulate</text>
  <line x1="452" y1="310" x2="536" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="495" y="330" text-anchor="middle" font-size="9.5" class="muted">applies level +</text>
  <text x="495" y="342" text-anchor="middle" font-size="9.5" class="muted">redaction + hashing</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>

  <!-- RIGHT panel: captured output -->
  <rect x="546" y="132" width="410" height="336" rx="10" class="panel"/>
  <text x="564" y="158" font-size="11" class="hdr">CAPTURED OUTPUT — WHAT WOULD BE STORED</text>

  <rect x="562" y="172" width="378" height="52" rx="7" class="row"/>
  <text x="576" y="194" font-size="12" class="lab">EnteredText</text>
  <text x="576" y="212" font-size="12" class="val">***-**-****</text>
  <text x="928" y="200" text-anchor="end" font-size="10" class="tagRed">redacted</text>

  <rect x="562" y="232" width="378" height="52" rx="7" class="row"/>
  <text x="576" y="254" font-size="12" class="lab">EnteredText</text>
  <text x="576" y="272" font-size="12" class="val">**** **** **** ****</text>
  <text x="928" y="260" text-anchor="end" font-size="10" class="tagRed">redacted</text>

  <rect x="562" y="292" width="378" height="52" rx="7" class="row"/>
  <text x="576" y="314" font-size="12" class="lab">Left click · TargetElementName</text>
  <text x="576" y="332" font-size="12" class="val">“Submit”</text>
  <text x="928" y="320" text-anchor="end" font-size="10" class="tagGrn">kept</text>

  <rect x="562" y="352" width="378" height="52" rx="7" class="row"/>
  <text x="576" y="374" font-size="12" class="lab">App / URL / SystemUser</text>
  <text x="576" y="392" font-size="12" class="val">Workday · workday.com/pay · 7f3a91…</text>
  <text x="928" y="380" text-anchor="end" font-size="10" class="tagBlu">hashed</text>

  <!-- verdict -->
  <rect x="34" y="486" width="922" height="70" rx="10" class="verdict"/>
  <text x="52" y="514" font-size="13" class="vtext" font-weight="bold">✓  Both sensitive values redacted · username hashed · screenshots off (Custom)</text>
  <text x="52" y="534" font-size="11.5" class="vtext">Nothing sensitive would leave the machine. Adjust the rule and re-run, or proceed.</text>
  <rect x="690" y="504" width="112" height="34" rx="7" class="btnO"/>
  <text x="746" y="526" text-anchor="middle" font-size="12" class="btnOT">Adjust rule</text>
  <rect x="812" y="504" width="128" height="34" rx="7" class="btnF"/>
  <text x="876" y="526" text-anchor="middle" font-size="12" class="btnFT">Looks good</text>
</svg>
