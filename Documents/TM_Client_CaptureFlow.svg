<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580" font-family="Arial, Helvetica, sans-serif">
  <style>
    :root { color-scheme: light; }
    .title { fill:#0f172a; font-weight:bold; }
    .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
    .lead { fill:#334155; font-weight:bold; }
    .sub { fill:#64748b; }
    .note { fill:#94a3b8; font-style:italic; }
    .hdrF { fill:#dcfce7; }
    .hdrU { fill:#eef2ff; }
    .hdrD { fill:#f1f5f9; }
    .cardF { fill:#ffffff; stroke:#86efac; stroke-width:1.5; }
    .cardU { fill:#ffffff; stroke:#a5b4fc; stroke-width:1.8; }
    .cardD { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
    .lock { fill:#64748b; font-weight:bold; }
    .edit { fill:#3730a3; font-weight:bold; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="410" y="34" text-anchor="middle" font-size="18" class="title">How a rule captures data</text>

  <!-- top flow -->
  <rect x="30"  y="60" width="190" height="58" rx="9" class="box"/>
  <text x="125" y="86" text-anchor="middle" font-size="13" class="lead">Event in an app</text>
  <text x="125" y="105" text-anchor="middle" font-size="11" class="sub">user clicks / types</text>

  <rect x="270" y="60" width="270" height="58" rx="9" class="box"/>
  <text x="405" y="83" text-anchor="middle" font-size="13" class="lead">Which rule's scope matches?</text>
  <text x="405" y="103" text-anchor="middle" font-size="11" class="sub">no match &#8594; the Default rule applies</text>

  <rect x="590" y="60" width="200" height="58" rx="9" class="box"/>
  <text x="690" y="86" text-anchor="middle" font-size="13" class="lead">Apply its capture level</text>
  <text x="690" y="105" text-anchor="middle" font-size="11" class="sub">Full / Custom / Deny</text>

  <line x1="220" y1="89" x2="268" y2="89" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="540" y1="89" x2="588" y2="89" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="410" y="168" text-anchor="middle" font-size="15" class="title">The 3 capture levels</text>

  <!-- Card: Full -->
  <rect x="40" y="190" width="230" height="320" rx="10" class="cardF"/>
  <rect x="40" y="190" width="230" height="42" rx="10" class="hdrF"/>
  <rect x="40" y="214" width="230" height="18" class="hdrF"/>
  <text x="155" y="217" text-anchor="middle" font-size="15" class="lead">Full</text>
  <text x="58" y="256" font-size="11.5" class="lock">&#128274; Locked &#8212; no attribute control</text>
  <text x="58" y="286" font-size="12" class="lead">Captures</text>
  <text x="58" y="308" font-size="12" class="sub">Everything &#8212; clicks,</text>
  <text x="58" y="326" font-size="12" class="sub">typed text, selected</text>
  <text x="58" y="344" font-size="12" class="sub">values, button &amp; screen</text>
  <text x="58" y="362" font-size="12" class="sub">names, screenshots</text>
  <text x="58" y="416" font-size="12" class="lead">Use for</text>
  <text x="58" y="438" font-size="12" class="sub">Apps you want to</text>
  <text x="58" y="456" font-size="12" class="sub">analyze in depth</text>

  <!-- Card: Custom -->
  <rect x="295" y="190" width="230" height="320" rx="10" class="cardU"/>
  <rect x="295" y="190" width="230" height="42" rx="10" class="hdrU"/>
  <rect x="295" y="214" width="230" height="18" class="hdrU"/>
  <text x="410" y="217" text-anchor="middle" font-size="15" class="lead">Custom</text>
  <text x="313" y="256" font-size="11.5" class="edit">&#9998; Editable &#8212; the one tunable tier</text>
  <text x="313" y="286" font-size="12" class="lead">Captures</text>
  <text x="313" y="308" font-size="12" class="sub">Pre-filled with a safe set:</text>
  <text x="313" y="326" font-size="12" class="sub">that the app/screen was</text>
  <text x="313" y="344" font-size="12" class="sub">used + button / element</text>
  <text x="313" y="362" font-size="12" class="sub">names. Content &amp;</text>
  <text x="313" y="380" font-size="12" class="sub">screenshots off by default.</text>
  <text x="313" y="416" font-size="12" class="lead">Adjust</text>
  <text x="313" y="438" font-size="12" class="sub">Add content / screenshots</text>
  <text x="313" y="456" font-size="12" class="sub">or pare back, per rule</text>

  <!-- Card: Deny -->
  <rect x="550" y="190" width="230" height="320" rx="10" class="cardD"/>
  <rect x="550" y="190" width="230" height="42" rx="10" class="hdrD"/>
  <rect x="550" y="214" width="230" height="18" class="hdrD"/>
  <text x="665" y="217" text-anchor="middle" font-size="15" class="lead">Deny</text>
  <text x="568" y="256" font-size="11.5" class="lock">&#128274; Locked &#8212; no attribute control</text>
  <text x="568" y="286" font-size="12" class="lead">Captures</text>
  <text x="568" y="308" font-size="12" class="sub">Nothing at all</text>
  <text x="568" y="416" font-size="12" class="lead">Use for</text>
  <text x="568" y="438" font-size="12" class="sub">Apps / URLs to</text>
  <text x="568" y="456" font-size="12" class="sub">exclude entirely</text>

  <text x="410" y="544" text-anchor="middle" font-size="12" class="note">Full and Deny are locked postures; Custom is the only tier where attributes can be edited.</text>
  <text x="410" y="564" text-anchor="middle" font-size="12" class="note">The Default rule = Full out of the box; a new rule starts with no level preselected.</text>
</svg>
